<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Sky/Cyan Gradient -->
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Top Sun/Flare Glow -->
    <radialGradient id="sunFlare" cx="75%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Puffy White Text Gradient -->
    <linearGradient id="puffyWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Letter Drop Shadow -->
    <filter id="bubblyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#075985" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#0C4A6E" flood-opacity="0.4"/>
    </filter>

    <!-- Outer Glow -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square App Badge Icon -->
  <rect x="20" y="20" width="460" height="460" rx="100" fill="url(#skyBg)" filter="url(#badgeGlow)"/>

  <!-- Top Sunburst Highlight Layer -->
  <rect x="20" y="20" width="460" height="460" rx="100" fill="url(#sunFlare)"/>
  
  <!-- Subtle White Edge Highlight -->
  <rect x="22" y="22" width="456" height="456" rx="98" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Arch Crown / Dome Accent Above 'V' (like the CAS logo arch) -->
  <path d="M 210 185 Q 250 150 290 185 Q 250 162 210 185 Z" fill="#FFFFFF" opacity="0.95" filter="url(#bubblyShadow)"/>

  <!-- Bubbly 3D White Text: RIVER -->
  <g filter="url(#bubblyShadow)" transform="translate(250, 315)">
    <text text-anchor="middle" font-family="'Fredoka', 'Comfortaa', 'Arial Black', sans-serif" font-weight="900" font-size="118" letter-spacing="-1" fill="url(#puffyWhite)" stroke="#0284C7" stroke-width="6" stroke-linejoin="round">
      RIVER
    </text>
  </g>
</svg>
