<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="pi River shield">
  <defs>
    <linearGradient id="shieldBody" x1="20" y1="8" x2="108" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.45" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#0C4A6E"/>
    </linearGradient>
    <linearGradient id="shieldRim" x1="24" y1="12" x2="104" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.5" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="piGold" x1="40" y1="36" x2="88" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7D1"/>
      <stop offset="0.4" stop-color="#F5C518"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0369A1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Shield silhouette -->
  <path
    filter="url(#softGlow)"
    d="M64 10c18 8 34 10 46 12v38c0 28-18 48-46 58-28-10-46-30-46-58V22c12-2 28-4 46-12z"
    fill="url(#shieldBody)"
    stroke="url(#shieldRim)"
    stroke-width="4"
  />

  <!-- Inner plate -->
  <path
    d="M64 22c14 6 26 8 35 9.5V50c0 21-13.5 36.5-35 44.5-21.5-8-35-23.5-35-44.5V31.5C38 30 50 28 64 22z"
    fill="#07111F"
    opacity="0.55"
  />

  <!-- Locked / encrypted card motif -->
  <rect x="44" y="40" width="40" height="52" rx="8" fill="#0B1220" stroke="#7DD3FC" stroke-width="2.5"/>
  <path d="M52 58h24M52 68h18M52 78h20" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <circle cx="72" cy="78" r="5" fill="url(#piGold)"/>
  <path d="M72 72v-5a6 6 0 0 0-12 0v5" stroke="url(#piGold)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Small pi spark -->
  <circle cx="90" cy="34" r="4" fill="#F5C518"/>
</svg>
